# Layanan database
services:
  db-webdinamis:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: password!123
      MARIADB_DATABASE: dbcompro
      MARIADB_USER: usercompro_2388010043
      MARIADB_PASSWORD: 12345
    volumes:
      - db_data:/var/lib/mysql
      - ./db_data/dbcompro.sql:/docker-entrypoint-initdb.d/dbcompro.sql:ro
    restart: always

  container-statis:
    image: muciiboss/compro_2388010043:latest
    ports:
      - "80:80"
    restart: always

  container-dinamis:
    image: uciiboss/web-dinamis:latest
    ports:
      - "3000:3000"
    restart: always
    environment:
      DB_USER: usercompro_2388010043
      DB_PASSWORD: 12345
      DB_NAME: dbcompro
      DB_HOST: db-webdinamis
      NEXTAUTH_SECRET: ini-kata-kata-bebas-saja-32-karekter
      NEXTAUTH_URL: http://3.25.181.208:3000
    depends_on:
      - db-webdinamis

volumes:
  db_data: {}
